name: shop_app
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  provider: ^6.1.5+1
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.2
  image_picker: ^1.2.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.5.0
  carousel_slider: ^5.1.1
  sqflite: ^2.4.2
  
  


  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
   

  
  flutter_lints: ^6.0.0
  flexi_cart_updater: ^1.0.6

dependency_overrides:
  characters: ^1.4.1
  material_color_utilities: ^0.13.0



flutter:

  
  uses-material-design: true

  
  assets:
   - assets/images/
  

  
  fonts:
   - family: Montserrat
     fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf
 
  
